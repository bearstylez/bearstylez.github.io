<style>
  :root { --paper: #E9E6E0; --ink: #1F1E1C; }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body { margin: 0; background: var(--paper); color: var(--ink); overflow-x: hidden; -webkit-font-smoothing: antialiased;
    font-family: Inter, system-ui, sans-serif; font-weight: 500; }
  .track { height: 600vh; }

  .stage { position: fixed; inset: 0; overflow: hidden; }
  body:not(.ready) .stage { visibility: hidden; }

  /* The word: a dithered canvas at CSS-pixel resolution, so each grain is a hard square dot */
  #word { position: absolute; left: 50%; transform: translateX(-50%); image-rendering: pixelated; }

  .label { position: absolute; text-transform: uppercase; letter-spacing: .02em; font-size: clamp(12px, 1.25vw, 20px); white-space: nowrap; }
  .top { top: 11vh; left: 0; right: 0; text-align: center; }
  .bottom { bottom: 8vh; }
  .bl { left: 7vw; } .bc { left: 50%; transform: translateX(-50%); } .br { right: 7vw; }
  @media (max-width: 640px) { .bc { display: none; } .bl { left: 16px; } .br { right: 16px; } }

  /* Typed copy under the word */
  #copy { position: absolute; left: 50%; transform: translateX(-50%); width: min(44em, calc(100vw - 32px)); text-align: center;
    text-transform: uppercase; font-size: clamp(13px, 1.1vw, 18px); line-height: 1.45; letter-spacing: .01em; }
  #copy p { margin: 0; }
  #copy .q { font-weight: 600; font-size: 1.25em; letter-spacing: .03em; margin-bottom: .6em; }
  #copy .a { line-height: 1.5; }

  /* Everything but the word waits for it to settle, then fades in (like the reference's first slice) */
  .label, #copy, #hint { opacity: 0; transition: opacity .7s ease .1s; }
  body.settled .label, body.settled #copy { opacity: 1; }
  body.settled #hint { opacity: .55; }
  #copy .word { white-space: nowrap; }
  #copy .ch { visibility: hidden; }
  #copy .ch.on { visibility: visible; }
  #copy a { color: inherit; text-decoration: underline; text-underline-offset: .2em; pointer-events: none; }
  .caret { display: inline-block; width: .55em; height: 1.05em; margin-left: .08em; vertical-align: -.18em; background: var(--ink);
    animation: blink .9s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #hint { position: absolute; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .2em; }
  #hint svg { display: block; margin: 8px auto 0; }
  /* After 5s without any input the arrow starts nudging downward (set by grain.js) */
  #hint.nudge svg { animation: nudge 1.4s ease-in-out infinite; }
  @keyframes nudge { 0%, 55%, 100% { transform: translateY(0); } 25% { transform: translateY(6px); } }

  /* Paper texture: a noise tile that jumps around ~12 times a second, plus a vignette */
  .grain { position: fixed; inset: -50%; width: 200%; height: 200%; pointer-events: none; animation: grain .7s steps(1) infinite; }
  @keyframes grain {
    0% { transform: translate(0, 0); } 12% { transform: translate(-7%, 4%); } 25% { transform: translate(3%, -9%); }
    37% { transform: translate(-11%, -3%); } 50% { transform: translate(8%, 7%); } 62% { transform: translate(-4%, 10%); }
    75% { transform: translate(10%, -5%); } 87% { transform: translate(-9%, 8%); }
  }
  #dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(70, 64, 56, .26) 100%); }

  @media (prefers-reduced-motion: reduce) {
    .grain, .caret, #hint.nudge svg { animation: none; }
  }
</style>
